<stop offset="1" stop-color="#1f1006"/>
</linearGradient>
<radialGradient id="halo" cx="32" cy="38" r="30" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#ffc470" stop-opacity=".62"/>
<stop offset=".42" stop-color="#f2a23a" stop-opacity=".26"/>
<stop offset="1" stop-color="#f2a23a" stop-opacity="0"/>
